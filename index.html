<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente Virtual - Escuela Técnica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
      background: linear-gradient(135deg, #1e3a5f 0%, #2e6da4 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .chat-container {
      width: 100%; max-width: 460px; height: 620px; background: #fff;
      border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.35);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-header {
      background: #1e3a5f; color: #fff; padding: 16px 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .chat-header .avatar {
      width: 42px; height: 42px; border-radius: 50%; background: #4fa3e3;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .chat-header h1 { font-size: 16px; font-weight: 600; }
    .chat-header p { font-size: 12px; opacity: .85; }
    #messages {
      flex: 1; overflow-y: auto; padding: 16px; background: #eef3f9;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #2e6da4; color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: #fff; color: #1a1a1a; border: 1px solid #d7e2ee; border-bottom-left-radius: 4px; }
    .msg.error { background: #fdeaea; border-color: #e7b8b8; color: #a33; }
    .typing { align-self: flex-start; background: #fff; color: #777; border: 1px solid #d7e2ee; border-radius: 14px; padding: 10px 14px; font-size: 14px; }
    .chat-input { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #e3eaf2; }
    .chat-input input {
      flex: 1; border: 1px solid #cdd9e8; border-radius: 24px; padding: 10px 16px;
      font-size: 14px; outline: none;
    }
    .chat-input input:focus { border-color: #2e6da4; }
    .chat-input button {
      background: #2e6da4; color: #fff; border: none; border-radius: 24px;
      padding: 10px 20px; font-size: 14px; cursor: pointer;
    }
    .chat-input button:disabled { background: #9bb6cc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🎓</div>
      <div>
        <h1>Asistente Virtual</h1>
        <p>Trámites académicos y administrativos</p>
      </div>
    </div>

    <div id="messages"></div>

    <div class="chat-input">
      <input id="userInput" type="text" placeholder="Escribí tu consulta..." autocomplete="off">
      <button id="sendBtn">Enviar</button>
    </div>
  </div>

  <script>
    // Detecta la URL de la API: si el frontend se sirve desde Flask usa
    // la ruta relativa /chat; si se abre como archivo local (file://)
    // apunta al servidor localhost:5000.
    const API_BASE = (location.protocol === 'file:') ? 'http://localhost:5000' : '';

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.textContent = '...';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      inputEl.value = '';
      sendBtn.disabled = true;
      const typing = showTyping();

      try {
        const res = await fetch(API_BASE + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });
        const data = await res.json();
        typing.remove();
        addMessage(data.response || 'No recibí una respuesta válida.', data.response ? 'bot' : 'error');
      } catch (err) {
        typing.remove();
        addMessage('No se pudo conectar con el servidor. Asegurate de que app.py esté corriendo.', 'error');
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    addMessage('Hola! ¿En qué te puedo ayudar?', 'bot');
    inputEl.focus();
  </script>
</body>
</html>
